name: checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*", "acqai--v*"]

# Cancel a superseded run when new commits land, so queues don't pile up.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # python3 ships on ubuntu-latest and every check below uses only the
      # standard library, so checkout is the one setup step. Playwright is
      # not installed here: the browser path is proved on a member's own
      # machine, and every command below runs without it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The scripts compile
        run: python3 -m py_compile plugins/acqai/scripts/acqai.py plugins/acqai/scripts/mozilib.py plugins/acqai/scripts/mozi_browser.py
      # tests/ holds the transport pair's tests, shared byte for byte with the
      # notes repo, and the script's own. Standard library only, like the rest
      # of this job: the page is a fake and the transport is never reached.
      - name: Unit tests
        run: ACQAI_STATE_DIR="$RUNNER_TEMP/acqai-tests" PYTHONPATH=plugins/acqai/scripts python3 -m unittest discover -s tests -p "test_*.py"
      # A commit's type is what the release reads, and CI writes the version,
      # so a message carries a Conventional Commit type and no version number.
      # A PR fails on a bad message. A push to main has already landed, so
      # there the check reports, and a commit without a type releases nothing.
      - name: Commit messages are Conventional Commits with no version
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 tools/release.py lint "origin/${{ github.base_ref }}..HEAD"
          else
            python3 tools/release.py lint --warn
          fi
      - name: The version is left for CI to stamp
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          read_version='import json,sys; print(json.load(sys.stdin)["version"])'
          before="$(git show "$base:plugins/acqai/.claude-plugin/plugin.json" | python3 -c "$read_version")"
          after="$(python3 -c "$read_version" < plugins/acqai/.claude-plugin/plugin.json)"
          if [[ "$before" != "$after" ]]; then
            echo "::error::plugin.json's version is stamped by CI after the merge; leave it at $before"
            exit 1
          fi
          if git diff "$base" -- CHANGELOG.md | grep -q '^+## \['; then
            echo "::error::CHANGELOG.md's version sections are written by CI after the merge"
            exit 1
          fi
          echo "the version stays $before until CI stamps the release"
      # py_compile only compiles the script, and --help runs the code that
      # builds the command table.
      - name: acqai.py --help exits 0
        run: python3 plugins/acqai/scripts/acqai.py --help
      - name: A dry run sends nothing and needs no yes
        run: ACQAI_STATE_DIR="$RUNNER_TEMP/acqai" python3 plugins/acqai/scripts/acqai.py send "hello" --dry-run | grep -q "nothing sent"
      # A fresh state dir holds no login: the ready dry run names it, exits
      # 1, and opens no browser and makes no venv.
      - name: A ready dry run names the login and runs nothing
        run: |
          state="$RUNNER_TEMP/acqai-ready"
          set +e
          out=$(ACQAI_STATE_DIR="$state" python3 plugins/acqai/scripts/acqai.py ready --dry-run 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          test "$code" -eq 1
          grep -q "login: no login saved yet" <<<"$out"
          test ! -e "$state/venv"
      # No yes on the command, no terminal to ask at: the send stops with
      # exit 3 before it touches the transport.
      - name: A send with no yes and no terminal stops before the transport
        run: |
          set +e
          ACQAI_STATE_DIR="$RUNNER_TEMP/acqai" python3 plugins/acqai/scripts/acqai.py send "hello" </dev/null
          code=$?
          set -e
          test "$code" -eq 3
      # Like setup, build the venv from the python3 that runs the script. Its
      # bin/python links back to that interpreter, so both resolve to one
      # file, and the browser commands must still hand off. A bare playwright
      # package in the venv tells the two apart: only a probe running inside
      # the venv says "installed here".
      - name: A browser command hands off to the venv setup made
        run: |
          state="$RUNNER_TEMP/acqai-venv"
          python3 -m venv --without-pip "$state/venv"
          site=$("$state/venv/bin/python" -c "import sysconfig; print(sysconfig.get_path('purelib'))")
          mkdir -p "$site/playwright"
          touch "$site/playwright/__init__.py"
          ACQAI_STATE_DIR="$state" python3 plugins/acqai/scripts/acqai.py probe --session | grep -q "^playwright: installed here"
      # `--file -` reads the question from stdin before the hop, and the child
      # under the venv cannot read it again, so the parent hands the text over
      # as the child's stdin. With no route on file here, the child then stops
      # in the transport: exit 1 and "no Mozi endpoint learned yet", which
      # proves the text crossed the hop (a child that read an empty stdin
      # stops earlier, with exit 2 and "is empty"). Nothing can be sent:
      # there is no endpoint and no browser here. Reuses the venv the step
      # above made.
      - name: send --file - carries the question across the venv hop
        run: |
          state="$RUNNER_TEMP/acqai-venv"
          set +e
          out=$(printf 'hello from stdin' | ACQAI_STATE_DIR="$state" python3 plugins/acqai/scripts/acqai.py send --file - -y 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          test "$code" -eq 1
          grep -q "no Mozi endpoint learned yet" <<<"$out"
      - name: Manifests parse as JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/acqai/.claude-plugin/plugin.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "$f does not parse as JSON" >&2; exit 1; }
          done
      - name: Claude marketplace validates
        run: |
          # The Claude Code CLI is not on the runner. Replicate the checks
          # `claude plugin validate` and `claude plugin tag` make: the
          # marketplace parses, and the plugin's version is SemVer.
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path
          market = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          plugin = json.loads(Path("plugins/acqai/.claude-plugin/plugin.json").read_text())
          entries = [p for p in market.get("plugins", []) if p.get("name") == plugin.get("name")]
          if len(entries) != 1:
              sys.exit(f"marketplace.json must list the plugin {plugin.get('name')!r} exactly once")
          version = plugin.get("version")
          if not version or not re.fullmatch(r"\d+\.\d+\.\d+([.-].+)?", str(version)):
              sys.exit(f"plugin.json version is not SemVer: {version!r}")
          entry_ver = entries[0].get("version")
          if entry_ver is not None and entry_ver != version:
              sys.exit(f"marketplace entry version is {entry_ver}, plugin.json is {version}")
          print(f"marketplace ok; plugin {plugin['name']} @ {version}")
          PY
      # CI stamps plugin.json and CHANGELOG.md in one commit at each release,
      # so the two always name the same version.
      - name: plugin.json version matches CHANGELOG.md
        run: |
          python3 - <<'PY'
          import json, re, sys
          with open("plugins/acqai/.claude-plugin/plugin.json") as f:
              version = json.load(f).get("version")
          with open("CHANGELOG.md") as f:
              heading = re.search(r"^## \[(\d+\.\d+\.\d+[^\]]*)\]", f.read(), re.M)
          newest = heading.group(1) if heading else None
          if version != newest:
              sys.exit(f"plugin.json version is {version}, and the first ## [x.y.z] heading in CHANGELOG.md is {newest}. CI stamps both; leave them to it.")
          print(f"plugin.json and CHANGELOG.md both say {version}.")
          PY
      # On a tag push, the tag name is the release: it must match plugin.json.
      - name: Tag version matches plugin.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          with open("plugins/acqai/.claude-plugin/plugin.json") as f:
              plugin = json.load(f)
          version = plugin["version"]
          name = plugin["name"]
          want = {f"v{version}", f"{name}--v{version}"}
          if tag not in want:
              sys.exit(f"tag is {tag}, want one of {sorted(want)}")
          print(f"tag {tag} matches plugin.json {version}.")
          PY

  # After each push to main: read the commits since the last release, stamp
  # the version they call for into plugin.json and CHANGELOG.md, tag
  # acqai--vX.Y.Z (Claude) and vX.Y.Z, push, and open a GitHub Release. That is
  # the publish for this marketplace. A push made with GITHUB_TOKEN starts no
  # new run, so the stamp commit does not loop.
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Stamp the version the merged commits call for
        id: stamp
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./release.sh --yes --push
      - name: Open the GitHub Release
        if: steps.stamp.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          set -euo pipefail
          tag="acqai--v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists"
          else
            gh release create "$tag" --title "acqai ${VERSION}" --notes "$(./release.sh notes "$VERSION")"
            echo "published GitHub Release $tag"
          fi
          echo
          echo "Claude marketplace publish: members who added scottsolowild/acqai-plugin"
          echo "pick this up on their next \`claude plugin marketplace update\`."
          echo "Anthropic's community catalog is a one-time submit at"
          echo "https://platform.claude.com/plugins/submit — after approval their"
          echo "CI bumps the pin on each push here."
