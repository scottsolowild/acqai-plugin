name: checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*", "acqai--v*"]

# Cancel a superseded run when new commits land, so queues don't pile up.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # python3 ships on ubuntu-latest and every check below uses only the
      # standard library, so checkout is the one setup step. Playwright is
      # not installed here: the browser path is proved on a member's own
      # machine, and every command below runs without it.
      - uses: actions/checkout@v5
      - name: The scripts compile
        run: python3 -m py_compile plugins/acqai/scripts/acqai.py plugins/acqai/scripts/mozilib.py plugins/acqai/scripts/mozi_browser.py
      # py_compile only compiles the script, and --help runs the code that
      # builds the command table.
      - name: acqai.py --help exits 0
        run: python3 plugins/acqai/scripts/acqai.py --help
      - name: A dry run sends nothing and needs no yes
        run: ACQAI_STATE_DIR="$RUNNER_TEMP/acqai" python3 plugins/acqai/scripts/acqai.py send "hello" --dry-run | grep -q "nothing sent"
      # No yes on the command, no terminal to ask at: the send stops with
      # exit 3 before it touches the transport.
      - name: A send with no yes and no terminal stops before the transport
        run: |
          set +e
          ACQAI_STATE_DIR="$RUNNER_TEMP/acqai" python3 plugins/acqai/scripts/acqai.py send "hello" </dev/null
          code=$?
          set -e
          test "$code" -eq 3
      - name: Manifests parse as JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/acqai/.claude-plugin/plugin.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "$f does not parse as JSON" >&2; exit 1; }
          done
      - name: Claude marketplace validates
        run: |
          # The Claude Code CLI is not on the runner. Replicate the checks
          # `claude plugin validate` and `claude plugin tag` make: the
          # marketplace parses, and the plugin's version is SemVer.
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path
          market = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          plugin = json.loads(Path("plugins/acqai/.claude-plugin/plugin.json").read_text())
          entries = [p for p in market.get("plugins", []) if p.get("name") == plugin.get("name")]
          if len(entries) != 1:
              sys.exit(f"marketplace.json must list the plugin {plugin.get('name')!r} exactly once")
          version = plugin.get("version")
          if not version or not re.fullmatch(r"\d+\.\d+\.\d+([.-].+)?", str(version)):
              sys.exit(f"plugin.json version is not SemVer: {version!r}")
          entry_ver = entries[0].get("version")
          if entry_ver is not None and entry_ver != version:
              sys.exit(f"marketplace entry version is {entry_ver}, plugin.json is {version}")
          print(f"marketplace ok; plugin {plugin['name']} @ {version}")
          PY
      # The version is typed by hand into plugin.json and CHANGELOG.md at each
      # release; CI tags acqai--vX.Y.Z (and vX.Y.Z) when that bump lands on main.
      - name: plugin.json version matches CHANGELOG.md
        run: |
          python3 - <<'PY'
          import json, re, sys
          with open("plugins/acqai/.claude-plugin/plugin.json") as f:
              version = json.load(f).get("version")
          with open("CHANGELOG.md") as f:
              heading = re.search(r"^## \[(\d+\.\d+\.\d+[^\]]*)\]", f.read(), re.M)
          newest = heading.group(1) if heading else None
          if version != newest:
              sys.exit(f"plugin.json version is {version}, and the first ## [x.y.z] heading in CHANGELOG.md is {newest}. Bump both in the same commit.")
          print(f"plugin.json and CHANGELOG.md both say {version}.")
          PY
      # On a tag push, the tag name is the release: it must match plugin.json.
      - name: Tag version matches plugin.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          with open("plugins/acqai/.claude-plugin/plugin.json") as f:
              plugin = json.load(f)
          version = plugin["version"]
          name = plugin["name"]
          want = {f"v{version}", f"{name}--v{version}"}
          if tag not in want:
              sys.exit(f"tag is {tag}, want one of {sorted(want)}")
          print(f"tag {tag} matches plugin.json {version}.")
          PY

  # On a version bump to main: tag acqai--vX.Y.Z (Claude) and vX.Y.Z, push,
  # and open a GitHub Release. That is the publish for this marketplace.
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag and publish if the version bumped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("plugins/acqai/.claude-plugin/plugin.json"))["version"])')"
          name="$(python3 -c 'import json; print(json.load(open("plugins/acqai/.claude-plugin/plugin.json"))["name"])')"
          claude_tag="${name}--v${version}"
          semver_tag="v${version}"

          prev=""
          if git rev-parse -q --verify HEAD^ >/dev/null; then
            prev="$(git show HEAD^:plugins/acqai/.claude-plugin/plugin.json 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)"
          fi
          if [[ "$prev" == "$version" ]]; then
            echo "version still $version (unchanged since parent); nothing to release"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$claude_tag" >/dev/null; then
            echo "$claude_tag already exists; nothing to release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./release.sh --yes --push

          notes="$(
            NOTES_VERSION="$version" python3 - <<'PY'
          import os, re
          version = os.environ["NOTES_VERSION"]
          text = open("CHANGELOG.md").read()
          m = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text, re.M | re.S)
          body = (m.group(1).strip() if m else "").strip()
          print(body or f"acqai {version}")
          PY
          )"
          if gh release view "$claude_tag" >/dev/null 2>&1; then
            echo "GitHub Release $claude_tag already exists"
          else
            gh release create "$claude_tag" \
              --title "acqai ${version}" \
              --notes "$notes" \
              --target "${{ github.sha }}"
            echo "published GitHub Release $claude_tag"
          fi
          echo
          echo "Claude marketplace publish: members who added scottsolowild/acqai-plugin"
          echo "pick this up on their next \`claude plugin marketplace update\`."
          echo "Anthropic's community catalog is a one-time submit at"
          echo "https://platform.claude.com/plugins/submit — after approval their"
          echo "CI bumps the pin on each push here."
